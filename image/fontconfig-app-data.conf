<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Operator-supplied fonts (house styles, or Times New Roman where a rule demands it). They live in
     /app/data/fonts so they are backed up; start.sh refreshes the caches when the folder has files. -->
<fontconfig>
  <dir>/app/data/fonts</dir>
  <cachedir>/run/docassemble/home/.cache/fontconfig</cachedir>
</fontconfig>

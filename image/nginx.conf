# The package's own front door on httpPort 8000, behind Cloudron's TLS proxy. Routes the web app to
# uWSGI, live help to the websocket server, and answers the health check (503 until ready).
worker_processes 2;
pid /run/docassemble/nginx.pid;
error_log stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Off: nginx runs as cloudron and cannot reopen root's stdout pipe; Cloudron's proxy logs requests.
    access_log off;
    sendfile on;
    server_tokens off;
    client_body_temp_path /run/docassemble/nginx/body;
    proxy_temp_path       /run/docassemble/nginx/proxy;
    fastcgi_temp_path     /run/docassemble/nginx/fastcgi;
    uwsgi_temp_path       /run/docassemble/nginx/uwsgi;
    scgi_temp_path        /run/docassemble/nginx/scgi;

    # Keep the scheme Cloudron's proxy saw (field guide #320: and the port, via $http_host).
    map $http_x_forwarded_proto $fwd_proto { "" $scheme; default $http_x_forwarded_proto; }

    server {
        listen 8000;
        client_max_body_size 100m;
        gzip on;
        gzip_types text/plain application/xml text/css text/javascript application/javascript image/vnd.microsoft.icon;

        # Cloudron's health check. docassemble's own /health_check answers before start-up has
        # finished, and with ?ready=1 it answers 400, which Cloudron reads as healthy.
        location = /healthz {
            if (!-f /run/docassemble/ready) { return 503; }
            rewrite ^ /health_check break;
            include /etc/nginx/uwsgi_params;
            uwsgi_pass unix:/run/docassemble/uwsgi.sock;
        }

        location / { try_files $uri @docassemble; }
        location @docassemble {
            include /etc/nginx/uwsgi_params;
            uwsgi_param HTTP_X_FORWARDED_PROTO $fwd_proto;
            uwsgi_read_timeout 600s;
            uwsgi_pass unix:/run/docassemble/uwsgi.sock;
        }

        location /ws {
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_pass http://127.0.0.1:5000;
        }
        location /ws/socket.io {
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_pass http://127.0.0.1:5000/socket.io;
        }

        # docassemble hands file downloads to nginx (use nginx to serve files).
        location /xaccel/ {
            internal;
            alias /;
        }
    }
}

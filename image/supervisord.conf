; Docassemble's long-running programs. supervisord runs as root (it must create its socket in /run,
; which root owns); every program runs as the cloudron user. All log to the container's stdout.

[supervisord]
user=root
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; Socket at the path a bare `supervisorctl` looks for (platform facts).
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

; docassemble restarts itself after a package install or a configuration edit by calling
; `supervisorctl -s http://localhost:9001 start reset` with these credentials (ADR 0004).
[inet_http_server]
port=127.0.0.1:9001
username=%(ENV_DASUPERVISORUSERNAME)s
password=%(ENV_DASUPERVISORPASSWORD)s

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:nginx]
command=/usr/sbin/nginx -c /app/code/image/nginx.conf -g "daemon off;"
user=cloudron
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:uwsgi]
command=/app/code/venv/bin/uwsgi --ini /app/code/image/uwsgi.ini
user=cloudron
autorestart=true
stopsignal=INT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:celery]
command=/app/code/venv/bin/celery -A docassemble.webapp.worker worker --loglevel=INFO -Q celery
user=cloudron
directory=/tmp
autorestart=true
stopwaitsecs=60
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:celerysingle]
command=/app/code/venv/bin/celery -A docassemble.webapp.worker worker --loglevel=INFO --concurrency=1 -Q single -n worker1@%%h
user=cloudron
directory=/tmp
autorestart=true
stopwaitsecs=60
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:websockets]
command=/app/code/venv/bin/python -u -m docassemble.webapp.socketserver
user=cloudron
directory=/tmp
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nltk]
command=/app/code/venv/bin/python -m docassemble.base.pattern_server
user=cloudron
directory=/tmp
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:unoserver]
command=/app/code/uno/bin/unoserver --interface 127.0.0.1 --port 2003
user=cloudron
directory=/tmp
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Writes the ready file once the web app answers, which turns /healthz from 503 to 200.
[program:ready]
command=/app/code/bin/ready.sh
user=cloudron
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Started by docassemble itself, never automatically.
[program:reset]
command=/app/code/bin/reset.sh
user=cloudron
autostart=false
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

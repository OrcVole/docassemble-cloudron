[uwsgi]
; After upstream's docassemble.ini.dist, with paths under /run and a clean exit on SIGTERM.
master = true
enable-threads = true
processes = 1
threads = 6
vhost = true
socket = /run/docassemble/uwsgi.sock
chmod-socket = 660
manage-script-name = true
mount = /=docassemble.webapp.run:application
venv = /app/code/venv
py-executable = /app/code/venv/bin/python
pidfile = /run/docassemble/uwsgi.pid
buffer-size = 32768
; docassemble restarts itself by touching this file (restart.py).
touch-reload = /run/docassemble/docassemble.wsgi
; uWSGI reloads on SIGTERM by default; Cloudron stops apps with it (field guide #89).
die-on-term = true
need-app = true
